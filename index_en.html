<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Membership Registration | Ogi Pharmacy</title>
    <meta name="description" content="Ogi Pharmacy enrollment form for new visitors.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="image/ogi_logo.png">
    <!-- Google Fonts 廃止 (OSネイティブシステムフォントによる超高速・ネイティブアプリライクな表示) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro JP"', '"Helvetica Neue"', 'Roboto', '"Segoe UI"', 'sans-serif'],
                    },
                    colors: {
                        sumi: '#2C2C2C',
                        primary: '#B0DAB8',
                        'primary-dark': '#9DCEA8',
                        'primary-light': '#C6E5CC',
                        accent: '#5DA98F',
                        'accent-dark': '#3D7E6B',
                        'accent-light': '#9CD4A3',
                        surface: '#F1F8F4',
                        'surface-dark': '#E8F1EB',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen bg-surface font-sans text-sumi">
    <!-- ヘッダー -->
    <div class="z-30 bg-surface/90 backdrop-blur-sm border-b border-sumi/[0.06]">
        <div class="max-w-lg mx-auto px-4 py-3">
            <!-- 店舗名 -->
            <div class="flex items-center justify-center gap-2">
                <img src="image/ogi_logo.png" alt="Ogi Pharmacy" class="w-12 h-12 object-contain">
                <h1 id="store-title" class="text-base font-bold text-sumi/80 tracking-wider">Ogi Pharmacy</h1>
            </div>
        </div>
    </div>

    <main class="max-w-lg mx-auto pt-6 pb-16 px-4 sm:px-6">
        <!-- ステップ コンテナ -->
        <div id="step-container" class="min-h-[55vh] flex flex-col">
            <!-- ヘッダー（タイトル・注釈は中央寄せ） -->
            <header class="mb-8 text-center">
                <h2 id="step-title" class="text-xl sm:text-2xl font-bold tracking-wide text-sumi mb-2"></h2>
                <p id="step-desc" class="text-sm text-sumi/50 leading-relaxed"></p>
            </header>

            <!-- フィールドエリア -->
            <div id="fields-area" class="flex-1 space-y-6"></div>
        </div>

        <!-- ステッパー（プログレスバー） -->
        <div id="stepper-container" class="mt-8 mb-4 mx-auto w-full max-w-[320px] px-2" style="display: none;"></div>

        <!-- ナビゲーションボタン -->
        <div class="mt-8 flex gap-3 w-1/2 min-w-[280px] mx-auto" id="nav-buttons">
            <button type="button" id="prev-btn" class="hidden flex-none px-5 py-3.5 rounded-xl border border-sumi/10 text-sumi/60 hover:text-sumi hover:border-sumi/20 transition-all text-sm font-medium">
                <span id="prev-text">Back</span>
            </button>
            <button type="button" id="next-btn" class="flex-1 bg-primary hover:bg-primary-dark text-sumi font-medium py-3.5 px-6 rounded-xl shadow-sm transition-all duration-200 hover:-translate-y-0.5 active:translate-y-0 flex justify-center items-center text-base tracking-wider whitespace-nowrap">
                <span id="next-text">Next</span>
                <svg id="next-arrow" class="ml-2 w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                </svg>
                <svg id="next-check" class="ml-2 w-4 h-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
                </svg>
                <svg id="submit-spinner" class="animate-spin ml-2 h-5 w-5 text-sumi hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </div>

        <footer class="text-center pt-10 mt-6">
            <p class="text-sumi/20 text-xs tracking-[0.15em]">オオギ薬局</p>
        </footer>
    </main>

    <!-- 送信完了画面（内容が画面より長い場合はスクロール可能） -->
    <div id="success-modal" class="fixed inset-0 z-[100] hidden bg-surface overflow-y-auto">
      <div class="min-h-full flex flex-col items-center justify-center py-10 px-6">
        <div class="relative z-10 w-full max-w-md text-center">
            <!-- チェックアイコン -->
            <div class="success-icon-bg w-24 h-24 bg-white rounded-full flex items-center justify-center mx-auto mb-10 shadow-[0_8px_30px_rgba(93,169,143,0.15)] opacity-0">
                <svg class="w-12 h-12 text-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path class="success-check" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
                </svg>
            </div>

            <div class="fade-up" style="animation-delay: 0.5s;">
                <h2 id="success-title" class="text-2xl sm:text-3xl font-bold tracking-wider text-sumi mb-4"></h2>
                <div class="w-12 h-[2px] bg-accent mx-auto mb-6 rounded-full"></div>
                <p id="success-message" class="text-sumi/70 leading-relaxed text-base mb-8"></p>

                <!-- 会員カード案内（来店時に提示） -->
                <div class="mb-4">
                    <h3 class="text-base font-bold text-sumi mb-1">About Your Membership Card</h3>
                    <p class="text-sm text-sumi/60 mb-3">Please show this card when you visit.</p>
                    <img src="image/membership_card_body.png" alt="Membership Card" class="w-full"/>
                </div>

            </div>

            <div class="mt-10 fade-up" style="animation-delay: 0.8s;">
                <p class="text-xs text-sumi/30 tracking-[0.15em]">Ogi Pharmacy</p>
            </div>
        </div>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
